name: Release plugin zip

# Builds the distributable zip and attaches it to a GitHub Release.
# Client org admins upload that zip to their own plugin library, because
# Anthropic refuses public repositories as organization marketplaces.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Deliberately NOT --strict. Anthropic's own directory review runs the
      # non-strict check, and --strict fails on `privacyPolicyUrl`, a field the
      # directory asks for and Claude Code ignores at load.
      - name: Validate Claude plugin
        run: npm i -g @anthropic-ai/claude-code && claude plugin validate .

      - name: Validate Cursor plugin
        run: node scripts/validate-cursor-plugin.mjs

      - name: Build zip
        run: ./scripts/package.sh

      # The tag must match the version in the manifests, or clients get a zip
      # whose filename disagrees with the version inside it.
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          [ "$TAG" = "$VER" ] || { echo "tag v$TAG != manifest $VER"; exit 1; }

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
          generate_release_notes: true
