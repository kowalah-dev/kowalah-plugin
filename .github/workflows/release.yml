name: Release plugin zip

# Builds the distributable zips and attaches them to a GitHub Release.
# Client org admins upload that zip to their own plugin library, because
# Anthropic refuses public repositories as organization marketplaces.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-tags so the steps below can read the release tag from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      # Deliberately NOT --strict. Anthropic's own directory review runs the
      # non-strict check, and --strict fails on `privacyPolicyUrl`, a field the
      # directory asks for and Claude Code ignores at load.
      - name: Validate Claude plugin
        run: npm i -g @anthropic-ai/claude-code && claude plugin validate .

      - name: Validate Cursor plugin
        run: node scripts/validate-cursor-plugin.mjs

      - name: Build zip
        run: ./scripts/package.sh

      # The tag must match the version in the manifests, or clients get a zip
      # whose filename disagrees with the version inside it. The tag is read
      # from git so this repo reads nothing from the runner's environment.
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          git tag --points-at HEAD | grep -qx "v$VER" || { echo "no tag v$VER on this commit"; exit 1; }

      # A fixed-name copy of the Claude zip, so
      # releases/latest/download/kowalah-plugin.zip always serves the current
      # version. The docs and README link there; the versioned files stay too.
      # package.sh builds exactly one Claude zip, kowalah-plugin-<version>.zip.
      - name: Add stable-name Claude zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp dist/kowalah-plugin-[0-9]*.zip dist/kowalah-plugin.zip

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
          generate_release_notes: true
